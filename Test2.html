<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CHOKET!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFFFFF;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .choket-container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: #FFFFFF;
            border: 1px solid #000000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border-radius: 0px;
            overflow: hidden;
        }

        .choket-header {
            padding: 24px 24px 16px 24px;
            text-align: center;
            border-bottom: 1px solid #000000;
            background: #FFFFFF;
        }

        .logo-image {
            max-width: 400px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .bag-section {
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid #EEEEEE;
        }

        .bag-section:active {
            background-color: #F5F5F5;
        }

        .bag-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bag-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bag-text {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            letter-spacing: 0.5px;
        }

        .bag-hint {
            font-size: 13px;
            color: #555555;
            margin-top: 8px;
        }

        .orders-panel {
            display: none;
            background: #FFFFFF;
            border-top: 1px solid #000000;
            animation: fadeSlideUp 0.25s ease-out;
        }

        .orders-panel.active {
            display: block;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-list {
            padding: 24px 24px 12px 24px;
        }

        .order-headline {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid #000000;
            padding-bottom: 12px;
            margin-bottom: 24px;
            color: #000000;
        }

        .order-item-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 20px;
            border-bottom: 1px solid #E5E5E5;
            margin-bottom: 16px;
            background: #FEFEFE;
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .order-item-card:hover {
            transform: scale(1.01);
            background: #FAFAFA;
        }

        .order-item-card:last-child {
            border-bottom: none;
        }

        .order-image-large {
            width: 280px;
            height: 280px;
            margin-bottom: 28px;
            background-color: #F8F8F8;
            border: 1px solid #DDDDDD;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
        }

        .order-image-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .order-image-large img:hover {
            transform: scale(1.02);
        }

        .order-details {
            width: 100%;
        }

        .order-item-name {
            font-size: 22px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .order-item-quantity {
            font-size: 17px;
            color: #333333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .order-item-price {
            font-size: 16px;
            font-weight: 600;
            color: #111111;
            margin-top: 8px;
            background: #F0F0F0;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
        }

        .total-section {
            padding: 24px 24px 28px 24px;
            border-top: 2px solid #000000;
            margin-top: 12px;
            background: #FFFFFF;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 20px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 16px;
        }

        .total-label {
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 18px;
        }

        .total-amount {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #000000;
        }

        .thankyou-message {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #1a5d1a;
            background: #E9F5E9;
            padding: 18px 16px;
            margin: 20px 0 10px 0;
            border-radius: 40px;
            letter-spacing: -0.2px;
            border: 1px solid #2a7a2a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            animation: gentlePulse 1.2s ease-in-out;
        }

        @keyframes gentlePulse {
            0% { opacity: 0.7; transform: scale(0.98);}
            100% { opacity: 1; transform: scale(1);}
        }

        .payment-info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 15px;
            color: #444444;
            padding-top: 12px;
            border-top: 1px solid #EEEEEE;
            margin-top: 12px;
        }

        .payment-label {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .payment-value {
            font-weight: 700;
            text-transform: capitalize;
            background: #F2F2F2;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .empty-message {
            text-align: center;
            padding: 48px 24px;
            color: #555555;
            font-size: 16px;
            border: 1.5px dashed #CCCCCC;
            margin: 20px 16px;
            background: #FCFCFC;
        }

        .footer-note {
            padding: 20px 24px;
            text-align: center;
            font-size: 12px;
            color: #666666;
            border-top: 1px solid #EEEEEE;
            background: #FFFFFF;
        }

        @media (max-width: 650px) {
            .order-image-large {
                width: 240px;
                height: 240px;
            }
            .order-item-name {
                font-size: 20px;
            }
            .total-amount {
                font-size: 24px;
            }
            .thankyou-message {
                font-size: 18px;
                padding: 14px 12px;
            }
        }

        @media (max-width: 550px) {
            body {
                padding: 12px;
            }
            .order-image-large {
                width: 220px;
                height: 220px;
            }
            .order-item-name {
                font-size: 18px;
            }
            .logo-image {
                max-width: 150px;
            }
            .total-amount {
                font-size: 22px;
            }
            .thankyou-message {
                font-size: 17px;
            }
        }

        @media (max-width: 450px) {
            .order-image-large {
                width: 190px;
                height: 190px;
            }
            .order-item-card {
                padding: 24px 12px;
            }
        }
    </style>
</head>
<body>

<div class="choket-container">
    <div class="choket-header">
        <img src="Choket.png" alt="CHOKET" class="logo-image" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22180%22%20height%3D%2260%22%20viewBox%3D%220%200%20180%2060%22%3E%3Ctext%20x%3D%2290%22%20y%3D%2238%22%20font-size%3D%2224%22%20text-anchor%3D%22middle%22%20fill%3D%22%23000%22%3ECHOKET%3C%2Ftext%3E%3C%2Fsvg%3E';">
    </div>

    <div class="bag-section" id="bagTrigger">
        <div class="bag-icon">
            <img src="Orderbag.png" alt="Bag" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2280%22%20height%3D%2280%22%20viewBox%3D%220%200%2080%2080%22%3E%3Crect%20width%3D%2280%22%20height%3D%2280%22%20fill%3D%22%23f0f0f0%22%2F%3E%3Ctext%20x%3D%2240%22%20y%3D%2245%22%20font-size%3D%2212%22%20text-anchor%3D%22middle%22%20fill%3D%22%23999%22%3Ebag%3C%2Ftext%3E%3C%2Fsvg%3E';">
        </div>
        <div class="bag-text">PLEASE TAKE YOUR ORDER</div>
        <div class="bag-hint">Open the bag</div>
    </div>

    <div class="orders-panel" id="ordersPanel">
        <div class="order-list">
            <div class="order-headline">YOUR PACKAGES</div>
            <div id="orderItemsContainer"></div>
        </div>
        <div class="total-section">
            <div class="total-row">
                <span class="total-label">TOTAL PURCHASE</span>
                <span class="total-amount" id="totalAmountDisplay">$0.00</span>
            </div>
            <div class="payment-info-row" id="paymentInfoRow" style="display: none;">
                <span class="payment-label">PAID WITH</span>
                <span class="payment-value" id="paymentMethodDisplay">-</span>
            </div>
            <div id="thankyouMessageContainer" style="margin-top: 16px;"></div>
        </div>
        <div class="footer-note">
            <span>2026 Kazine, featured by Kachoo</span>
        </div>
    </div>
</div>

<script>
    // ========== MAPPING ID KE FILE GAMBAR ==========
    // PAKAI ID SEPERTI A1, A2, B1, B2, C1, C2, C3, C4, D1, D2, D3, D4
    const imageMap = {
        // CHOOSIC HEADPHONE
        "A1": "A1.png",
        "A2": "A2.png",
        // CHOZY MUG
        "B1": "B1.png",
        "B2": "B2.png",
        // CHO°L LARGE TUMBLER
        "C1": "C1.png",
        "C2": "C2.png",
        // CHO°L STAINLESS TUMBLER
        "C3": "C3.png",
        "C4": "C4.png",
        // ORIGINAL CHOFFEE
        "D1": "D1.png",
        "D2": "D2.png",
        "D3": "D3.png",
        // CAPSULE CHOFFEE
        "D4": "D4.png"
    };

    // ========== NAMA PRODUK LENGKAP UNTUK DISPLAY ==========
    const productNames = {
        "A1": "Choosic Headphone - Graphite Black",
        "A2": "Choosic Headphone - White",
        "B1": "Chozy Mug - Black",
        "B2": "Chozy Mug - White",
        "C1": "Large Tumbler - Black",
        "C2": "Large Tumbler - White",
        "C3": "Stainless Tumbler - Black",
        "C4": "Stainless Tumbler - White",
        "D1": "Original Choffee - Robusta Strong",
        "D2": "Original Choffee - Perfect Latte",
        "D3": "Original Choffee - Arabica Prime",
        "D4": "Capsule Choffee - Espresso"
    };

    // ========== HARGA PRODUK ==========
    const productPrices = {
        "A1": 480,
        "A2": 480,
        "B1": 30,
        "B2": 30,
        "C1": 10,
        "C2": 10,
        "C3": 6,
        "C4": 6,
        "D1": 3,
        "D2": 3,
        "D3": 3,
        "D4": 4
    };

    // ========== FUNGSI UNTUK MENDAPATKAN GAMBAR BERDASARKAN ID ==========
    function getImageForItem(itemId) {
        if (!itemId) return null;
        return imageMap[itemId] || null;
    }

    function getProductName(itemId) {
        if (!itemId) return itemId;
        return productNames[itemId] || itemId;
    }

    function getProductPrice(itemId) {
        if (!itemId) return 0;
        return productPrices[itemId] || 0;
    }

    function isValidItem(itemId) {
        return imageMap[itemId] !== undefined;
    }

    // ========== GET PAYMENT METHOD ==========
    function getPaymentMethodFromOrder(order) {
        if (order && order.paymentMethod) {
            const method = order.paymentMethod;
            if (method === 'chobank') return 'CHOBANK';
            if (method === 'qris') return 'QRIS';
            return method.toUpperCase();
        }
        return null;
    }

    // ========== FETCH ORDER ITEMS ==========
    function fetchValidOrderItems() {
        try {
            const orderDataRaw = localStorage.getItem('kazineOrder');
            let paymentMethod = null;
            
            if (orderDataRaw) {
                const order = JSON.parse(orderDataRaw);
                paymentMethod = getPaymentMethodFromOrder(order);
                
                if (order.items && Array.isArray(order.items) && order.items.length > 0) {
                    const validItems = [];
                    for (let item of order.items) {
                        const itemId = item.id || item.productId;
                        if (itemId && isValidItem(itemId)) {
                            validItems.push({
                                id: itemId,
                                name: getProductName(itemId),
                                quantity: item.quantity || 1,
                                price: getProductPrice(itemId),
                                imageFile: getImageForItem(itemId)
                            });
                        }
                    }
                    if (validItems.length > 0) {
                        return { items: validItems, paymentMethod: paymentMethod };
                    }
                }
            }
            
            // Coba baca dari cart
            const cartRaw = localStorage.getItem('kazineCart');
            if (cartRaw) {
                const cart = JSON.parse(cartRaw);
                if (Array.isArray(cart) && cart.length > 0) {
                    const validItems = [];
                    for (let item of cart) {
                        const itemId = item.id || item.productId;
                        if (itemId && isValidItem(itemId)) {
                            validItems.push({
                                id: itemId,
                                name: getProductName(itemId),
                                quantity: item.quantity || 1,
                                price: getProductPrice(itemId),
                                imageFile: getImageForItem(itemId)
                            });
                        }
                    }
                    if (validItems.length > 0) {
                        return { items: validItems, paymentMethod: paymentMethod };
                    }
                }
            }
            
            return { items: [], paymentMethod: null };
        } catch (err) {
            console.error("Error reading order data:", err);
            return { items: [], paymentMethod: null };
        }
    }

    // ========== ESCAPE HTML ==========
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ========== RENDER THANK YOU ==========
    function renderThankYouMessage(hasItems) {
        const thankyouContainer = document.getElementById('thankyouMessageContainer');
        if (!thankyouContainer) return;
        
        if (hasItems) {
            thankyouContainer.innerHTML = `
                <div class="thankyou-message">
                    🙏 THANK YOU FOR YOUR ORDER 🙏
                    <div style="font-size: 14px; font-weight: normal; margin-top: 6px;">we truly appreciate your support</div>
                </div>
            `;
        } else {
            thankyouContainer.innerHTML = '';
        }
    }

    // ========== RENDER ORDERS ==========
    function renderOrders(validItems, paymentMethod) {
        const container = document.getElementById('orderItemsContainer');
        const totalSpan = document.getElementById('totalAmountDisplay');
        const paymentInfoRow = document.getElementById('paymentInfoRow');
        const paymentMethodDisplay = document.getElementById('paymentMethodDisplay');
        
        if (!validItems.length) {
            container.innerHTML = `<div class="empty-message">✨ No valid order found.<br>Please complete your purchase first at KAZINE payment page.<br>📦 Add items & checkout to see enlarged photos ✨</div>`;
            totalSpan.textContent = "$0.00";
            paymentInfoRow.style.display = 'none';
            renderThankYouMessage(false);
            return;
        }
        
        let html = '';
        let totalSum = 0;
        
        for (let item of validItems) {
            const itemTotal = item.price * item.quantity;
            totalSum += itemTotal;
            const imgSrc = `./${item.imageFile}`;
            
            html += `
                <div class="order-item-card">
                    <div class="order-image-large">
                        <img src="${imgSrc}" alt="${escapeHtml(item.name)}" loading="lazy" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22280%22%20height%3D%22280%22%20viewBox%3D%220%200%20280%20280%22%3E%3Crect%20width%3D%22280%22%20height%3D%22280%22%20fill%3D%22%23f4f4f4%22%2F%3E%3Ctext%20x%3D%22140%22%20y%3D%22150%22%20font-size%3D%2216%22%20text-anchor%3D%22middle%22%20fill%3D%22%23999%22%3E${escapeHtml(item.name)}%3C%2Ftext%3E%3C%2Fsvg%3E';">
                    </div>
                    <div class="order-details">
                        <div class="order-item-name">${escapeHtml(item.name)}</div>
                        <div class="order-item-quantity">📦 Quantity: ${item.quantity}</div>
                        <div class="order-item-price">$${item.price.toFixed(2)} each</div>
                    </div>
                </div>
            `;
        }
        
        container.innerHTML = html;
        totalSpan.textContent = `$${totalSum.toFixed(2)}`;
        
        if (paymentMethod) {
            paymentMethodDisplay.textContent = paymentMethod;
            paymentInfoRow.style.display = 'flex';
        } else {
            paymentInfoRow.style.display = 'none';
        }
        
        renderThankYouMessage(true);
    }

    // ========== LOAD AND SHOW ==========
    function loadAndShowOrders() {
        const panel = document.getElementById('ordersPanel');
        const { items, paymentMethod } = fetchValidOrderItems();
        renderOrders(items, paymentMethod);
        if (!panel.classList.contains('active')) {
            panel.classList.add('active');
        }
        setTimeout(() => {
            panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }

    // ========== EVENT LISTENERS ==========
    document.getElementById('bagTrigger').addEventListener('click', function(e) {
        loadAndShowOrders();
    });

    const panel = document.getElementById('ordersPanel');
    panel.classList.remove('active');

    window.addEventListener('storage', function(e) {
        if (e.key === 'kazineOrder' || e.key === 'kazineCart') {
            if (panel.classList.contains('active')) {
                const { items, paymentMethod } = fetchValidOrderItems();
                renderOrders(items, paymentMethod);
            }
        }
    });

    console.log("CHOKET ready - Using ID mapping: A1, A2, B1, B2, C1, C2, C3, C4, D1, D2, D3, D4");
    console.log("Images: A1.png, A2.png, B1.png, B2.png, C1.png, C2.png, C3.png, C4.png, D1.png, D2.png, D3.png, D4.png");
</script>
</body>
</html>
