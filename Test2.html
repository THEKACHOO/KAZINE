<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CHOKET!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFFFFF;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .choket-container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: #FFFFFF;
            border: 1px solid #000000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border-radius: 0px;
            overflow: hidden;
        }

        .choket-header {
            padding: 12px 24px 10px 24px;
            text-align: center;
            border-bottom: 1px solid #000000;
            background: #FFFFFF;
        }

        .logo-image {
            max-width: 100px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .bag-section {
            padding: 28px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid #EEEEEE;
        }

        .bag-section:active {
            background-color: #F5F5F5;
        }

        .bag-icon {
            width: 200px;
            height: 200px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bag-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bag-text {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            letter-spacing: 0.5px;
        }

        .bag-hint {
            font-size: 13px;
            color: #555555;
            margin-top: 4px;
        }

        .orders-panel {
            display: none;
            background: #FFFFFF;
            border-top: 1px solid #000000;
            animation: fadeSlideUp 0.25s ease-out;
        }

        .orders-panel.active {
            display: block;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-list {
            padding: 24px 24px 12px 24px;
        }

        .order-headline {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid #000000;
            padding-bottom: 12px;
            margin-bottom: 24px;
            color: #000000;
        }

        .order-item-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 20px;
            border-bottom: 1px solid #E5E5E5;
            margin-bottom: 16px;
            background: #FEFEFE;
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .order-item-card:hover {
            transform: scale(1.01);
            background: #FAFAFA;
        }

        .order-item-card:last-child {
            border-bottom: none;
        }

        .order-image-large {
            width: 280px;
            height: 280px;
            margin-bottom: 20px;
            background-color: #F8F8F8;
            border: 1px solid #DDDDDD;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
        }

        .order-image-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .order-image-large img:hover {
            transform: scale(1.02);
        }

        .order-details {
            width: 100%;
        }

        .order-item-name {
            font-size: 22px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .order-item-quantity {
            font-size: 17px;
            color: #333333;
            font-weight: 500;
        }

        .total-section {
            padding: 20px 24px 24px 24px;
            border-top: 2px solid #000000;
            margin-top: 12px;
            background: #FFFFFF;
        }

        .payment-info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 15px;
            color: #444444;
            padding-top: 12px;
            border-top: 1px solid #EEEEEE;
            margin-top: 12px;
        }

        .payment-label {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .payment-value {
            font-weight: 700;
            text-transform: capitalize;
            background: #F2F2F2;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .empty-message {
            text-align: center;
            padding: 48px 24px;
            color: #555555;
            font-size: 16px;
            border: 1.5px dashed #CCCCCC;
            margin: 20px 16px;
            background: #FCFCFC;
        }

        .footer-note {
            padding: 20px 24px;
            text-align: center;
            font-size: 12px;
            color: #666666;
            border-top: 1px solid #EEEEEE;
            background: #FFFFFF;
        }

        .thankyou-message {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #000000;
            background: #F0F0F0;
            padding: 18px 16px;
            margin: 20px 0 10px 0;
            border-radius: 40px;
            letter-spacing: -0.2px;
            border: 1px solid #AAAAAA;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            animation: gentlePulse 1.2s ease-in-out;
        }

        @keyframes gentlePulse {
            0% { opacity: 0.7; transform: scale(0.98);}
            100% { opacity: 1; transform: scale(1);}
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #000000;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 16px;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: #333333;
        }

        .download-btn:active {
            background: #555555;
        }

        @media (max-width: 650px) {
            .order-image-large {
                width: 240px;
                height: 240px;
            }
            .order-item-name {
                font-size: 20px;
            }
            .thankyou-message {
                font-size: 18px;
                padding: 14px 12px;
            }
            .bag-icon {
                width: 160px;
                height: 160px;
            }
            .logo-image {
                max-width: 80px;
            }
        }

        @media (max-width: 550px) {
            body {
                padding: 12px;
            }
            .order-image-large {
                width: 220px;
                height: 220px;
            }
            .order-item-name {
                font-size: 18px;
            }
            .logo-image {
                max-width: 70px;
            }
            .thankyou-message {
                font-size: 17px;
            }
            .bag-icon {
                width: 140px;
                height: 140px;
            }
        }

        @media (max-width: 450px) {
            .order-image-large {
                width: 190px;
                height: 190px;
            }
            .order-item-card {
                padding: 24px 12px;
            }
            .bag-icon {
                width: 120px;
                height: 120px;
            }
            .logo-image {
                max-width: 60px;
            }
        }
    </style>
</head>
<body>

<div class="choket-container">
    <div class="choket-header">
        <img src="Choket.png" alt="CHOKET" class="logo-image" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%22%20height%3D%2236%22%20viewBox%3D%220%200%20100%2036%22%3E%3Ctext%20x%3D%2250%22%20y%3D%2224%22%20font-size%3D%2216%22%20text-anchor%3D%22middle%22%20fill%3D%22%23000%22%3ECHOKET%3C%2Ftext%3E%3C%2Fsvg%3E';">
    </div>

    <div class="bag-section" id="bagTrigger">
        <div class="bag-icon" id="bagIcon">
            <img src="Orderbag.png" alt="Bag" id="bagImage" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%22200%22%20viewBox%3D%220%200%20200%20200%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20fill%3D%22%23f0f0f0%22%2F%3E%3Ctext%20x%3D%22100%22%20y%3D%22110%22%20font-size%3D%2220%22%20text-anchor%3D%22middle%22%20fill%3D%22%23999%22%3EBAG%3C%2Ftext%3E%3C%2Fsvg%3E';">
        </div>
        <div class="bag-text">PLEASE TAKE YOUR ORDER</div>
        <div class="bag-hint">Open the bag</div>
    </div>

    <div class="orders-panel" id="ordersPanel">
        <div class="order-list">
            <div class="order-headline">YOUR PACKAGES</div>
            <div id="orderItemsContainer"></div>
        </div>
        <div class="total-section">
            <div class="payment-info-row" id="paymentInfoRow" style="display: none;">
                <span class="payment-label">PAID WITH</span>
                <span class="payment-value" id="paymentMethodDisplay">-</span>
            </div>
            <div id="thankyouMessageContainer" style="margin-top: 16px;"></div>
            <button class="download-btn" id="downloadBtn">Download All Images</button>
        </div>
        <div class="footer-note">
            <span>2026 Kazine, featured by Kachoo</span>
        </div>
    </div>
</div>

<script>
    // ========== MAPPING ID KE FILE GAMBAR ==========
    // PAKAI PATH ABSOLUT DARI ROOT
    const imageMap = {
        "A1": "/KAZINE/Product/A1.png",
        "A2": "/KAZINE/Product/A2.png",
        "B1": "/KAZINE/Product/B1.png",
        "B2": "/KAZINE/Product/B2.png",
        "C1": "/KAZINE/Product/C1.png",
        "C2": "/KAZINE/Product/C2.png",
        "C3": "/KAZINE/Product/C3.png",
        "C4": "/KAZINE/Product/C4.png",
        "D1": "/KAZINE/Product/D1.png",
        "D2": "/KAZINE/Product/D2.png",
        "D3": "/KAZINE/Product/D3.png",
        "D4": "/KAZINE/Product/D4.png"
    };

    const productNames = {
        "A1": "Choosic Headphone - Graphite Black",
        "A2": "Choosic Headphone - White",
        "B1": "Chozy Mug - Black",
        "B2": "Chozy Mug - White",
        "C1": "Large Tumbler - Black",
        "C2": "Large Tumbler - White",
        "C3": "Stainless Tumbler - Black",
        "C4": "Stainless Tumbler - White",
        "D1": "Original Choffee - Robusta Strong",
        "D2": "Original Choffee - Perfect Latte",
        "D3": "Original Choffee - Arabica Prime",
        "D4": "Capsule Choffee - Espresso"
    };

    function getImageForItem(itemId) {
        if (!itemId) return null;
        return imageMap[itemId] || null;
    }

    function getProductName(itemId) {
        if (!itemId) return itemId;
        return productNames[itemId] || itemId;
    }

    function isValidItem(itemId) {
        return imageMap[itemId] !== undefined;
    }

    function getPaymentMethodFromOrder(order) {
        if (order && order.paymentMethod) {
            const method = order.paymentMethod;
            if (method === 'chobank') return 'CHOBANK';
            if (method === 'qris') return 'QRIS';
            return method.toUpperCase();
        }
        return null;
    }

    function getTotalQuantity(items) {
        let total = 0;
        for (let item of items) {
            total += (item.quantity || 1);
        }
        return total;
    }

    function fetchValidOrderItems() {
        try {
            const orderDataRaw = localStorage.getItem('kazineOrder');
            let paymentMethod = null;
            
            if (orderDataRaw) {
                const order = JSON.parse(orderDataRaw);
                paymentMethod = getPaymentMethodFromOrder(order);
                
                if (order.items && Array.isArray(order.items) && order.items.length > 0) {
                    const validItems = [];
                    for (let item of order.items) {
                        const itemId = item.id || item.productId;
                        if (itemId && isValidItem(itemId)) {
                            validItems.push({
                                id: itemId,
                                name: getProductName(itemId),
                                quantity: item.quantity || 1,
                                imageFile: getImageForItem(itemId)
                            });
                        }
                    }
                    if (validItems.length > 0) {
                        return { items: validItems, paymentMethod: paymentMethod };
                    }
                }
            }
            
            const cartRaw = localStorage.getItem('kazineCart');
            if (cartRaw) {
                const cart = JSON.parse(cartRaw);
                if (Array.isArray(cart) && cart.length > 0) {
                    const validItems = [];
                    for (let item of cart) {
                        const itemId = item.id || item.productId;
                        if (itemId && isValidItem(itemId)) {
                            validItems.push({
                                id: itemId,
                                name: getProductName(itemId),
                                quantity: item.quantity || 1,
                                imageFile: getImageForItem(itemId)
                            });
                        }
                    }
                    if (validItems.length > 0) {
                        return { items: validItems, paymentMethod: paymentMethod };
                    }
                }
            }
            
            return { items: [], paymentMethod: null };
        } catch (err) {
            console.error("Error reading order data:", err);
            return { items: [], paymentMethod: null };
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderThankYouMessage(hasItems) {
        const thankyouContainer = document.getElementById('thankyouMessageContainer');
        if (!thankyouContainer) return;
        
        if (hasItems) {
            thankyouContainer.innerHTML = `
                <div class="thankyou-message">
                    THANK YOU FOR YOUR ORDER
                    <div style="font-size: 14px; font-weight: normal; margin-top: 6px; color: #555555;">we truly appreciate your support</div>
                </div>
            `;
        } else {
            thankyouContainer.innerHTML = '';
        }
    }

    function updateBagIcon(totalQuantity) {
        const bagImage = document.getElementById('bagImage');
        if (totalQuantity > 5) {
            bagImage.src = 'Orderbox.png';
            bagImage.alt = 'Box';
            bagImage.onerror = function() {
                this.onerror = null;
                this.src = 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%22200%22%20viewBox%3D%220%200%20200%20200%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20fill%3D%22%23f0f0f0%22%2F%3E%3Ctext%20x%3D%22100%22%20y%3D%22110%22%20font-size%3D%2220%22%20text-anchor%3D%22middle%22%20fill%3D%22%23999%22%3EBOX%3C%2Ftext%3E%3C%2Fsvg%3E';
            };
        } else {
            bagImage.src = 'Orderbag.png';
            bagImage.alt = 'Bag';
            bagImage.onerror = function() {
                this.onerror = null;
                this.src = 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%22200%22%20viewBox%3D%220%200%20200%20200%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20fill%3D%22%23f0f0f0%22%2F%3E%3Ctext%20x%3D%22100%22%20y%3D%22110%22%20font-size%3D%2220%22%20text-anchor%3D%22middle%22%20fill%3D%22%23999%22%3EBAG%3C%2Ftext%3E%3C%2Fsvg%3E';
            };
        }
    }

    function renderOrders(validItems, paymentMethod) {
        const container = document.getElementById('orderItemsContainer');
        const paymentInfoRow = document.getElementById('paymentInfoRow');
        const paymentMethodDisplay = document.getElementById('paymentMethodDisplay');
        const downloadBtn = document.getElementById('downloadBtn');
        
        const totalQty = getTotalQuantity(validItems);
        updateBagIcon(totalQty);
        
        if (!validItems.length) {
            container.innerHTML = `<div class="empty-message">No valid order found.<br>Please complete your purchase first at KAZINE payment page.<br>Add items and checkout to see enlarged photos</div>`;
            paymentInfoRow.style.display = 'none';
            renderThankYouMessage(false);
            downloadBtn.style.display = 'none';
            return;
        }
        
        downloadBtn.style.display = 'block';
        let html = '';
        
        for (let item of validItems) {
            const imgSrc = item.imageFile;
            
            html += `
                <div class="order-item-card" data-image="${imgSrc}">
                    <div class="order-image-large">
                        <img src="${imgSrc}" alt="${escapeHtml(item.name)}" loading="lazy" onerror="this.onerror=null; console.error('Failed to load:', this.src); this.style.display='none';">
                    </div>
                    <div class="order-details">
                        <div class="order-item-name">${escapeHtml(item.name)}</div>
                        <div class="order-item-quantity">Quantity: ${item.quantity}</div>
                    </div>
                </div>
            `;
        }
        
        container.innerHTML = html;
        
        if (paymentMethod) {
            paymentMethodDisplay.textContent = paymentMethod;
            paymentInfoRow.style.display = 'flex';
        } else {
            paymentInfoRow.style.display = 'none';
        }
        
        renderThankYouMessage(true);
    }

    function downloadAllImages() {
        const imageElements = document.querySelectorAll('.order-image-large img');
        if (!imageElements.length) return;
        
        imageElements.forEach((img, index) => {
            const imgSrc = img.src;
            if (!imgSrc || imgSrc.startsWith('data:')) {
                console.warn('Skipping data URL image');
                return;
            }
            fetch(imgSrc)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.blob();
                })
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    const filename = imgSrc.split('/').pop().split('?')[0] || `image_${index + 1}.png`;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                })
                .catch(() => {
                    console.warn('Could not download image, trying canvas fallback:', imgSrc);
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth || 280;
                        canvas.height = img.naturalHeight || 280;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        const link = document.createElement('a');
                        link.download = `image_${index + 1}.png`;
                        link.href = canvas.toDataURL('image/png');
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    } catch (e) {
                        console.warn('Could not download image:', imgSrc);
                    }
                });
        });
    }

    function loadAndShowOrders() {
        const panel = document.getElementById('ordersPanel');
        const { items, paymentMethod } = fetchValidOrderItems();
        renderOrders(items, paymentMethod);
        if (!panel.classList.contains('active')) {
            panel.classList.add('active');
        }
        setTimeout(() => {
            panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }

    // ========== CEK BAG ICON SAAT HALAMAN DIMUAT ==========
    function checkBagIconOnLoad() {
        const { items } = fetchValidOrderItems();
        const totalQty = getTotalQuantity(items);
        updateBagIcon(totalQty);
    }

    document.getElementById('bagTrigger').addEventListener('click', function(e) {
        loadAndShowOrders();
    });

    document.getElementById('downloadBtn').addEventListener('click', function(e) {
        downloadAllImages();
    });

    const panel = document.getElementById('ordersPanel');
    panel.classList.remove('active');

    window.addEventListener('storage', function(e) {
        if (e.key === 'kazineOrder' || e.key === 'kazineCart') {
            checkBagIconOnLoad();
            if (panel.classList.contains('active')) {
                const { items, paymentMethod } = fetchValidOrderItems();
                renderOrders(items, paymentMethod);
            }
        }
    });

    // ========== JALANKAN SAAT HALAMAN LOAD ==========
    checkBagIconOnLoad();

    console.log("CHOKET ready - Images from /KAZINE/Product/ folder (absolute path)");
    console.log("Mapping: A1, A2, B1, B2, C1, C2, C3, C4, D1, D2, D3, D4");
    console.log("Total quantity akan menentukan icon Bag atau Box");
</script>
</body>
</html>
