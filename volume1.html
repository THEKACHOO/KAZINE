<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazine Volume 1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header Styles */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
            animation: fadeIn 1.5s ease-out;
        }
        
        .logo {
            width: 300px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            transition: transform 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.03);
        }
        
        /* Grid Styles */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin: 40px 0;
            animation: slideUp 1s ease-out;
        }
        
        .grid-item {
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            height: 300px;
            position: relative;
            border: 1px solid #f0f0f0;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .grid-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            border-color: #000000;
        }
        
        .grid-item-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        .grid-item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .grid-item:hover .grid-item-image {
            transform: scale(1.05);
        }
        
        .grid-item-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 60%, rgba(0,0,0,0.7) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .grid-item:hover .grid-item-overlay {
            opacity: 1;
        }
        
        .grid-item-overlay h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        
        .grid-item-overlay p {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        .grid-item-number {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background-color: #000000;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 2;
        }
        
        .grid-item-secret {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            pointer-events: none;
        }
        
        .secret-icon {
            font-size: 40px;
            color: #ffffff;
            margin-bottom: 15px;
        }
        
        .secret-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* Button Styles */
        .button-container {
            display: flex;
            justify-content: center;
            margin: 50px 0;
            animation: fadeIn 2s ease-out;
        }
        
        .audition-btn {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
        }
        
        .audition-btn:hover {
            background-color: #333333;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }
        
        .audition-btn:active {
            transform: translateY(-2px);
        }
        
        .audition-btn i {
            margin-left: 10px;
            font-size: 20px;
        }
        
        /* Footer Styles */
        footer {
            text-align: center;
            padding: 30px 0;
            color: #777777;
            font-size: 14px;
            border-top: 1px solid #eeeeee;
            margin-top: 40px;
            animation: fadeIn 2.5s ease-out;
        }
        
        footer p {
            margin: 5px 0;
        }
        
        .made-by {
            font-weight: 600;
            color: #000000;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .grid-item {
                height: 250px;
            }
            
            .logo {
                width: 250px;
            }
            
            .audition-btn {
                padding: 15px 30px;
                font-size: 16px;
            }
        }
        
        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .grid-item {
                height: 200px;
            }
            
            .logo {
                width: 200px;
            }
            
            .audition-btn {
                padding: 12px 25px;
                font-size: 14px;
            }
            
            .grid-item-overlay h3 {
                font-size: 16px;
            }
            
            .grid-item-overlay p {
                font-size: 12px;
            }
        }
    </style>
</head>
