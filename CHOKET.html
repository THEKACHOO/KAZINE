<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CHOKET!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFFFFF;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .choket-container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: #FFFFFF;
            border: 1px solid #000000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border-radius: 0px;
            overflow: hidden;
        }

        /* Header dengan logo */
        .choket-header {
            padding: 24px 24px 16px 24px;
            text-align: center;
            border-bottom: 1px solid #000000;
            background: #FFFFFF;
        }

        .logo-image {
            max-width: 400px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Bag section (clickable) */
        .bag-section {
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid #EEEEEE;
        }

        .bag-section:active {
            background-color: #F5F5F5;
        }

        .bag-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bag-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bag-text {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            letter-spacing: 0.5px;
        }

        .bag-hint {
            font-size: 13px;
            color: #555555;
            margin-top: 8px;
        }

        /* Orders Panel */
        .orders-panel {
            display: none;
            background: #FFFFFF;
            border-top: 1px solid #000000;
            animation: fadeSlideUp 0.25s ease-out;
        }

        .orders-panel.active {
            display: block;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Order items - FOTO SANGAT BESAR dan menonjol */
        .order-list {
            padding: 24px 24px 12px 24px;
        }

        .order-headline {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid #000000;
            padding-bottom: 12px;
            margin-bottom: 24px;
            color: #000000;
        }

        .order-item-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 20px;
            border-bottom: 1px solid #E5E5E5;
            margin-bottom: 16px;
            background: #FEFEFE;
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .order-item-card:hover {
            transform: scale(1.01);
            background: #FAFAFA;
        }

        .order-item-card:last-child {
            border-bottom: none;
        }

        /* UKURAN FOTO DIPERBESAR secara signifikan */
        .order-image-large {
            width: 280px;
            height: 280px;
            margin-bottom: 28px;
            background-color: #F8F8F8;
            border: 1px solid #DDDDDD;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
        }

        .order-image-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .order-image-large img:hover {
            transform: scale(1.02);
        }

        .order-details {
            width: 100%;
        }

        .order-item-name {
            font-size: 22px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .order-item-quantity {
            font-size: 17px;
            color: #333333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .order-item-price {
            font-size: 16px;
            font-weight: 600;
            color: #111111;
            margin-top: 8px;
            background: #F0F0F0;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
        }

        /* Total section dengan ucapan terima kasih */
        .total-section {
            padding: 24px 24px 28px 24px;
            border-top: 2px solid #000000;
            margin-top: 12px;
            background: #FFFFFF;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 20px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 16px;
        }

        .total-label {
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 18px;
        }

        .total-amount {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #000000;
        }

        /* THANK YOU MESSAGE - DIPERINTAHKAN */
        .thankyou-message {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #1a5d1a;
            background: #E9F5E9;
            padding: 18px 16px;
            margin: 20px 0 10px 0;
            border-radius: 40px;
            letter-spacing: -0.2px;
            border: 1px solid #2a7a2a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            animation: gentlePulse 1.2s ease-in-out;
        }

        @keyframes gentlePulse {
            0% { opacity: 0.7; transform: scale(0.98);}
            100% { opacity: 1; transform: scale(1);}
        }

        .payment-info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 15px;
            color: #444444;
            padding-top: 12px;
            border-top: 1px solid #EEEEEE;
            margin-top: 12px;
        }

        .payment-label {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .payment-value {
            font-weight: 700;
            text-transform: capitalize;
            background: #F2F2F2;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .empty-message {
            text-align: center;
            padding: 48px 24px;
            color: #555555;
            font-size: 16px;
            border: 1.5px dashed #CCCCCC;
            margin: 20px 16px;
            background: #FCFCFC;
        }

        .footer-note {
            padding: 20px 24px;
            text-align: center;
            font-size: 12px;
            color: #666666;
            border-top: 1px solid #EEEEEE;
            background: #FFFFFF;
        }

        /* Responsive: foto lebih besar di tablet dan hp tetap proporsional */
        @media (max-width: 650px) {
            .order-image-large {
                width: 240px;
                height: 240px;
            }
            .order-item-name {
                font-size: 20px;
            }
            .total-amount {
                font-size: 24px;
            }
            .thankyou-message {
                font-size: 18px;
                padding: 14px 12px;
            }
        }

        @media (max-width: 550px) {
            body {
                padding: 12px;
            }
            .order-image-large {
                width: 220px;
                height: 220px;
            }
            .order-item-name {
                font-size: 18px;
            }
            .logo-image {
                max-width: 150px;
            }
            .total-amount {
                font-size: 22px;
            }
            .thankyou-message {
                font-size: 17px;
            }
        }

        @media (max-width: 450px) {
            .order-image-large {
                width: 190px;
                height: 190px;
            }
            .order-item-card {
                padding: 24px 12px;
            }
        }
    </style>
</head>
<body>

<div class="choket-container">
    <!-- Header dengan logo CHOKET.png -->
    <div class="choket-header">
        <img src="Choket.png" alt="CHOKET" class="logo-image" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22180%22%20height%3D%2260%22%20viewBox%3D%220%200%20180%2060%22%3E%3Ctext%20x%3D%2290%22%20y%3D%2238%22%20font-size%3D%2224%22%20text-anchor%3D%22middle%22%20fill%3D%22%23000%22%3ECHOKET%3C%2Ftext%3E%3C%2Fsvg%3E';">
    </div>

    <!-- Bag section dengan icon Orderbag.png diperbesar -->
    <div class="bag-section" id="bagTrigger">
        <div class="bag-icon">
            <img src="Orderbag.png" alt="Bag" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2280%22%20height%3D%2280%22%20viewBox%3D%220%200%2080%2080%22%3E%3Crect%20width%3D%2280%22%20height%3D%2280%22%20fill%3D%22%23f0f0f0%22%2F%3E%3Ctext%20x%3D%2240%22%20y%3D%2245%22%20font-size%3D%2212%22%20text-anchor%3D%22middle%22%20fill%3D%22%23999%22%3Ebag%3C%2Ftext%3E%3C%2Fsvg%3E';">
        </div>
        <div class="bag-text">PLEASE TAKE YOUR ORDER</div>
        <div class="bag-hint">Open the bag</div>
    </div>

    <!-- Orders Panel -->
    <div class="orders-panel" id="ordersPanel">
        <div class="order-list">
            <div class="order-headline">YOUR PACKAGES</div>
            <div id="orderItemsContainer"></div>
        </div>
        <div class="total-section">
            <div class="total-row">
                <span class="total-label">TOTAL PURCHASE</span>
                <span class="total-amount" id="totalAmountDisplay">$0.00</span>
            </div>
            <div class="payment-info-row" id="paymentInfoRow" style="display: none;">
                <span class="payment-label">PAID WITH</span>
                <span class="payment-value" id="paymentMethodDisplay">-</span>
            </div>
            <!-- UCAPAN TERIMA KASIH SETELAH TOTAL (sesuai permintaan) -->
            <div id="thankyouMessageContainer" style="margin-top: 16px;"></div>
        </div>
        <div class="footer-note">
            <span>2026 Kazine, featured by Kachoo</span>
        </div>
    </div>
</div>

<script>
    // Product image mapping (semua file gambar yang tersedia)
    const imageMap = {
        "Choosic Graphite Black": "Order1.png",
        "Choosic White": "Order2.png",
        "Choosic Espresso Brown": "Order3.png",
        "Choosic Vanilla Haze": "Order4.png",
        "Choosic Mulberry Wine": "Order5.png",
        "Choosic Rose Noir": "Order6.png",
        "Chozy Black": "Order7.png",
        "Chozy White": "Order8.png",
        "Chozy Blue": "Order9.png",
        "Chozy Orange": "Order10.png",
        "Chozy Green": "Order11.png",
        "Chozy Yellow": "Order12.png"
    };

    function getImageForItem(itemName) {
        if (!itemName) return null;
        if (imageMap[itemName]) return imageMap[itemName];
        
        const lowerName = itemName.toLowerCase().trim();
        for (let [key, filename] of Object.entries(imageMap)) {
            if (key.toLowerCase() === lowerName) return filename;
        }
        return null;
    }

    function isValidItem(itemName) {
        return getImageForItem(itemName) !== null;
    }

    // Get payment method from order data
    function getPaymentMethodFromOrder(order) {
        if (order && order.paymentMethod) {
            const method = order.paymentMethod;
            if (method === 'chobank') return 'CHOBANK';
            if (method === 'qris') return 'QRIS';
            return method.toUpperCase();
        }
        return null;
    }

    // Fetch order data from localStorage (prioritas kazineOrder kemudian kazineCart)
    function fetchValidOrderItems() {
        try {
            const orderDataRaw = localStorage.getItem('kazineOrder');
            let paymentMethod = null;
            
            if (orderDataRaw) {
                const order = JSON.parse(orderDataRaw);
                paymentMethod = getPaymentMethodFromOrder(order);
                
                if (order.items && Array.isArray(order.items) && order.items.length > 0) {
                    const validItems = [];
                    for (let item of order.items) {
                        const itemTitle = item.title || item.name;
                        if (itemTitle && isValidItem(itemTitle)) {
                            validItems.push({
                                name: itemTitle,
                                quantity: item.quantity || 1,
                                price: parseFloat(item.price) || 0,
                                imageFile: getImageForItem(itemTitle)
                            });
                        }
                    }
                    if (validItems.length > 0) {
                        return { items: validItems, paymentMethod: paymentMethod };
                    }
                }
            }
            
            const cartRaw = localStorage.getItem('kazineCart');
            if (cartRaw) {
                const cart = JSON.parse(cartRaw);
                if (Array.isArray(cart) && cart.length > 0) {
                    const validItems = [];
                    for (let item of cart) {
                        const itemTitle = item.title || item.name;
                        if (itemTitle && isValidItem(itemTitle)) {
                            validItems.push({
                                name: itemTitle,
                                quantity: item.quantity || 1,
                                price: parseFloat(item.price) || 0,
                                imageFile: getImageForItem(itemTitle)
                            });
                        }
                    }
                    if (validItems.length > 0) {
                        return { items: validItems, paymentMethod: paymentMethod };
                    }
                }
            }
            
            return { items: [], paymentMethod: null };
        } catch (err) {
            console.error("Error reading order data:", err);
            return { items: [], paymentMethod: null };
        }
    }

    function computeTotal(validItems) {
        let total = 0;
        for (let item of validItems) {
            total += (item.price * item.quantity);
        }
        return total;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Fungsi untuk menampilkan ucapan "Thank you for your order" setelah total
    function renderThankYouMessage(hasItems) {
        const thankyouContainer = document.getElementById('thankyouMessageContainer');
        if (!thankyouContainer) return;
        
        if (hasItems) {
            thankyouContainer.innerHTML = `
                <div class="thankyou-message">
                    🙏 THANK YOU FOR YOUR ORDER 🙏
                    <div style="font-size: 14px; font-weight: normal; margin-top: 6px;">we truly appreciate your support</div>
                </div>
            `;
        } else {
            thankyouContainer.innerHTML = ''; // tidak tampil jika tidak ada order valid
        }
    }

    function renderOrders(validItems, paymentMethod) {
        const container = document.getElementById('orderItemsContainer');
        const totalSpan = document.getElementById('totalAmountDisplay');
        const paymentInfoRow = document.getElementById('paymentInfoRow');
        const paymentMethodDisplay = document.getElementById('paymentMethodDisplay');
        
        if (!validItems.length) {
            container.innerHTML = `<div class="empty-message">✨ No valid order found.<br>Please complete your purchase first at KAZINE payment page.<br>📦 Add items & checkout to see enlarged photos ✨</div>`;
            totalSpan.textContent = "$0.00";
            paymentInfoRow.style.display = 'none';
            renderThankYouMessage(false);   // tidak ada ucapan karena kosong
            return;
        }
        
        let html = '';
        let totalSum = 0;
        
        for (let item of validItems) {
            const itemTotal = item.price * item.quantity;
            totalSum += itemTotal;
            const imgSrc = `./${item.imageFile}`;
            
            // FOTO SANGAT BESAR dengan ukuran 280x280 (atau responsif)
            html += `
                <div class="order-item-card">
                    <div class="order-image-large">
                        <img src="${imgSrc}" alt="${escapeHtml(item.name)}" loading="lazy" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22280%22%20height%3D%22280%22%20viewBox%3D%220%200%20280%20280%22%3E%3Crect%20width%3D%22280%22%20height%3D%22280%22%20fill%3D%22%23f4f4f4%22%2F%3E%3Ctext%20x%3D%22140%22%20y%3D%22150%22%20font-size%3D%2216%22%20text-anchor%3D%22middle%22%20fill%3D%22%23999%22%3E${escapeHtml(item.name)}%3C%2Ftext%3E%3C%2Fsvg%3E';">
                    </div>
                    <div class="order-details">
                        <div class="order-item-name">${escapeHtml(item.name)}</div>
                        <div class="order-item-quantity">📦 Quantity: ${item.quantity}</div>
                        <div class="order-item-price">$${item.price.toFixed(2)} each</div>
                    </div>
                </div>
            `;
        }
        
        container.innerHTML = html;
        totalSpan.textContent = `$${totalSum.toFixed(2)}`;
        
        // Tampilkan payment method jika ada
        if (paymentMethod) {
            paymentMethodDisplay.textContent = paymentMethod;
            paymentInfoRow.style.display = 'flex';
        } else {
            paymentInfoRow.style.display = 'none';
        }
        
        // Tampilkan ucapan terima kasih karena ada item pesanan
        renderThankYouMessage(true);
    }
    
    function loadAndShowOrders() {
        const panel = document.getElementById('ordersPanel');
        const { items, paymentMethod } = fetchValidOrderItems();
        renderOrders(items, paymentMethod);
        if (!panel.classList.contains('active')) {
            panel.classList.add('active');
        }
        setTimeout(() => {
            panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }
    
    // Event listener untuk bag (klik untuk memperbesar tampilan order)
    document.getElementById('bagTrigger').addEventListener('click', function(e) {
        loadAndShowOrders();
    });
    
    // Panel hidden at start
    const panel = document.getElementById('ordersPanel');
    panel.classList.remove('active');
    
    // Optional: jika ingin langsung menampilkan pesanan jika sudah ada data? tidak, sesuai UX: klik tas
    // Tapi jika halaman dimuat dan terdapat order, tetap panel tersembunyi sampai diklik.
    // Namun kita bisa menyediakan pengalaman tambahan: mendeteksi perubahan storage untuk update realtime
    window.addEventListener('storage', function(e) {
        if (e.key === 'kazineOrder' || e.key === 'kazineCart') {
            if (panel.classList.contains('active')) {
                const { items, paymentMethod } = fetchValidOrderItems();
                renderOrders(items, paymentMethod);
            }
        }
    });
    
    // Demo data tambahan: jika tidak ada data sama sekali, bisa menampilkan pesan tapi bag tetap fungsional.
    // Tidak perlu hardcoded dummy karena sistem terhubung dengan KAZINE.
    console.log("CHOKET ready - PERBESAR FOTO & THANK YOU MESSAGE after total");
</script>
</body>
    </html>
