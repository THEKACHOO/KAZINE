<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHOKET</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: white;
            color: black;
            padding: 30px 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border: 1px solid black;
            padding: 30px 28px 40px 28px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: black;
            border-bottom: 2px solid black;
            display: inline-block;
            padding-bottom: 8px;
        }

        .sub {
            color: black;
            margin-bottom: 32px;
            font-weight: 400;
            font-size: 0.9rem;
        }

        /* Grid item - gambar diperbesar */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
            margin-bottom: 48px;
        }

        /* Card item */
        .item-card {
            background: white;
            border: 1px solid black;
        }

        /* Area gambar BESAR - diperbesar */
        .image-area {
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 20px;
            min-height: 380px;
            border-bottom: 1px solid black;
        }

        .item-img {
            max-width: 100%;
            height: auto;
            max-height: 360px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
        }

        .item-info {
            padding: 18px 20px 22px;
        }

        .item-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: black;
        }

        .item-price {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 20px;
            color: black;
        }

        /* Tombol unduh - hitam putih */
        .download-btn {
            background: black;
            color: white;
            border: 1px solid black;
            padding: 12px 20px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            text-align: center;
        }

        .download-btn:hover {
            background: white;
            color: black;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        /* Total section + ucapan terima kasih */
        .total-section {
            margin-top: 20px;
            padding-top: 28px;
            border-top: 2px solid black;
            text-align: center;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: 800;
            display: inline-block;
            padding: 12px 32px;
            margin-bottom: 20px;
            color: black;
            border: 1px solid black;
        }

        .thankyou-message {
            font-size: 1.5rem;
            font-weight: 500;
            color: black;
            padding: 20px 20px;
            text-align: center;
            border: 1px solid black;
            background: white;
        }

        footer {
            margin-top: 24px;
            font-size: 0.7rem;
            text-align: center;
            color: black;
            border-top: 1px solid black;
            padding-top: 16px;
        }

        @media (max-width: 700px) {
            .container {
                padding: 20px 16px;
            }
            .item-title {
                font-size: 1.2rem;
            }
            .thankyou-message {
                font-size: 1.2rem;
            }
            .total-amount {
                font-size: 1.5rem;
            }
            .image-area {
                min-height: 280px;
            }
            .item-img {
                max-height: 260px;
            }
        }

        /* notifikasi sukses unduh */
        .toast-msg {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: black;
            color: white;
            padding: 10px 24px;
            font-weight: 500;
            font-size: 0.9rem;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            border: 1px solid white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CHOKET</h1>
    <div class="sub">Klik gambar untuk melihat lebih besar | Tekan tombol unduh untuk menyimpan foto</div>

    <div class="items-grid" id="itemsGrid"></div>

    <div class="total-section">
        <div class="total-amount" id="totalPriceDisplay">Rp0</div>
        <div class="thankyou-message" id="thankyouMsg">Thank you for your order in Kazine Collection</div>
    </div>
    <footer>Setiap item memiliki tombol unduh | Klik unduh untuk menyimpan foto</footer>
</div>
<div id="toastMsg" class="toast-msg"></div>

<script>
    // DATA ITEM (tas)
    const itemsData = [
        {
            id: 1,
            name: "Leather Tote Bag - Black",
            price: 549000,
            imageUrl: "https://images.pexels.com/photos/1152077/pexels-photo-1152077.jpeg?auto=compress&cs=tinysrgb&w=800&h=800&fit=crop",
            fileName: "kazine_tote_bag_black.jpg"
        },
        {
            id: 2,
            name: "Mini Crossbody Bag",
            price: 425000,
            imageUrl: "https://images.pexels.com/photos/909786/pexels-photo-909786.jpeg?auto=compress&cs=tinysrgb&w=800&h=800&fit=crop",
            fileName: "kazine_crossbody.jpg"
        },
        {
            id: 3,
            name: "Vintage Shoulder Bag",
            price: 679000,
            imageUrl: "https://images.pexels.com/photos/934070/pexels-photo-934070.jpeg?auto=compress&cs=tinysrgb&w=800&h=800&fit=crop",
            fileName: "kazine_vintage_shoulder.jpg"
        },
        {
            id: 4,
            name: "Canvas Tote Bag",
            price: 299000,
            imageUrl: "https://images.pexels.com/photos/1029604/pexels-photo-1029604.jpeg?auto=compress&cs=tinysrgb&w=800&h=800&fit=crop",
            fileName: "kazine_canvas_tote.jpg"
        }
    ];

    function calculateTotal() {
        return itemsData.reduce((sum, item) => sum + item.price, 0);
    }

    function formatRupiah(amount) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
    }

    async function downloadImage(imageUrl, fileName) {
        const toast = document.getElementById('toastMsg');
        try {
            toast.style.opacity = '1';
            toast.innerText = 'Mengunduh gambar...';
            setTimeout(() => {
                if(toast.style.opacity === '1') toast.style.opacity = '0';
            }, 1200);
            
            const response = await fetch(imageUrl, { mode: 'cors' });
            if (!response.ok) throw new Error('Gagal mengambil gambar');
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(blobUrl);
            
            toast.innerText = 'Berhasil diunduh';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 1500);
        } catch (error) {
            console.error(error);
            toast.innerText = 'Gagal mengunduh, coba lagi';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }
    }

    function openFullImage(imageUrl) {
        window.open(imageUrl, '_blank');
    }

    function renderItems() {
        const gridContainer = document.getElementById('itemsGrid');
        if (!gridContainer) return;

        gridContainer.innerHTML = '';
        
        itemsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            
            const imageArea = document.createElement('div');
            imageArea.className = 'image-area';
            
            const img = document.createElement('img');
            img.src = item.imageUrl;
            img.alt = item.name;
            img.className = 'item-img';
            img.loading = 'lazy';
            img.addEventListener('click', (e) => {
                e.stopPropagation();
                openFullImage(item.imageUrl);
            });
            imageArea.appendChild(img);
            
            const infoDiv = document.createElement('div');
            infoDiv.className = 'item-info';
            
            const title = document.createElement('div');
            title.className = 'item-title';
            title.innerText = item.name;
            
            const price = document.createElement('div');
            price.className = 'item-price';
            price.innerText = formatRupiah(item.price);
            
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn';
            downloadBtn.innerText = 'UNDUH FOTO';
            downloadBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                downloadImage(item.imageUrl, item.fileName);
            });
            
            infoDiv.appendChild(title);
            infoDiv.appendChild(price);
            infoDiv.appendChild(downloadBtn);
            
            card.appendChild(imageArea);
            card.appendChild(infoDiv);
            gridContainer.appendChild(card);
        });
        
        const totalElement = document.getElementById('totalPriceDisplay');
        if (totalElement) {
            totalElement.innerText = formatRupiah(calculateTotal());
        }
    }
    
    function init() {
        renderItems();
        const thankyouDiv = document.getElementById('thankyouMsg');
        if (thankyouDiv) {
            thankyouDiv.innerText = 'Thank you for your order in Kazine Collection';
        }
    }
    
    init();
</script>
</body>
    </html>
